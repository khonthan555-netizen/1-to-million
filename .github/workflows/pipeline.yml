name: Verify cloud 3D pipeline
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install Blender and media tools
        run: sudo apt-get update && sudo apt-get install -y blender ffmpeg
      - run: npm ci
      - run: npm run pipeline
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-3d-preview
          path: |
            dist/
            artifacts/test-scene.blend
